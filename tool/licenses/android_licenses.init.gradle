// Gradle init script used by android_licenses.dart.
//
// Resolves what the app ships on Android (the release runtime classpath of
// :app), and for every module writes one JSON line: its coordinates, the
// licenses its POM declares (following parent POMs), and any notice files it
// carries inside its own archive. Nothing is decided here — the Dart tool
// turns this into notices and stops on anything it cannot name.

import groovy.json.JsonOutput
import java.util.zip.ZipFile

allprojects { project ->
  if (project.path != ':app') return
  project.tasks.register('appplayerLicenses') {
    doLast {
      def out = new File(System.getProperty('appplayer.licenses.out'))
      out.parentFile.mkdirs()
      def lines = []
      def config = project.configurations.getByName('releaseRuntimeClasspath')
      // External modules only: the app's Flutter plugins are Dart packages,
      // whose notices Flutter collects itself.
      def modules = config.incoming.resolutionResult.allComponents
          .collect { it.id }
          .findAll { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
      modules.each { id ->
        def key = "${id.group}:${id.module}:${id.version}"
        def licenses = licensesOf(project, id.group, id.module, id.version, 0)
        def holders = holdersOf(project, id.group, id.module, id.version)
        def notices = []
        def natives = [] as Set
        def file = archiveOf(project, id.group, id.module, id.version)
        if (file != null) {
          try {
            new ZipFile(file).withCloseable { zip ->
              zip.entries().each { e ->
                def n = e.name.toLowerCase()
                def base = n.substring(n.lastIndexOf('/') + 1)
                // Native libraries this module brings, so the app's own
                // libraries can be traced back to a module.
                if (!e.isDirectory() && base.endsWith('.so')) natives << e.name.substring(e.name.lastIndexOf('/') + 1)
                if (!e.isDirectory() && (base.startsWith('license') || base.startsWith('notice') ||
                    base.startsWith('third_party_licenses') || base.startsWith('copying'))) {
                  notices << [path: e.name, text: zip.getInputStream(e).getText('UTF-8')]
                }
              }
            }
          } catch (ignored) {}
        }
        lines << JsonOutput.toJson([module: key, licenses: licenses, holders: holders, notices: notices, natives: natives as List])
      }
      out.text = lines.join('\n')
    }
  }
}

def archiveOf(project, group, name, version) {
  for (ext in ['aar', 'jar']) {
    def cfg = project.configurations.detachedConfiguration(
        project.dependencies.create("${group}:${name}:${version}@${ext}"))
    cfg.transitive = false
    try {
      def files = cfg.resolve()
      if (!files.isEmpty()) return files.iterator().next()
    } catch (ignored) {}
  }
  return null
}

def licensesOf(project, group, name, version, depth) {
  if (depth > 5) return []
  def dep = project.dependencies.create("${group}:${name}:${version}@pom")
  def cfg = project.configurations.detachedConfiguration(dep)
  cfg.transitive = false
  def files
  try { files = cfg.resolve() } catch (ignored) { return [] }
  if (files.isEmpty()) return []
  def pom = new groovy.xml.XmlSlurper(false, false).parse(files.iterator().next())
  def found = pom.licenses.license.collect { [name: it.name.text().trim(), url: it.url.text().trim()] }
  if (!found.isEmpty()) return found
  def p = pom.parent
  if (p.artifactId.text()) {
    return licensesOf(project, p.groupId.text(), p.artifactId.text(), p.version.text(), depth + 1)
  }
  return []
}

// Who holds the copyright, as the POM says it: the organization, else the
// developers. MIT and BSD notices are not complete without it.
def holdersOf(project, group, name, version) {
  def cfg = project.configurations.detachedConfiguration(
      project.dependencies.create("${group}:${name}:${version}@pom"))
  cfg.transitive = false
  def files
  try { files = cfg.resolve() } catch (ignored) { return [] }
  if (files.isEmpty()) return []
  def pom = new groovy.xml.XmlSlurper(false, false).parse(files.iterator().next())
  def org = pom.organization.name.text().trim()
  if (org) return [org]
  return pom.developers.developer.collect { (it.name.text() ?: it.id.text()).trim() }.findAll { it }
}
